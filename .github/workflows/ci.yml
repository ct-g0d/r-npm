name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify:
    name: Workspace Verification Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pinned Rust Toolchain (1.99.1)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: clippy, rustfmt

      - name: Setup Node.js Oracle
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Pin Explicit npm Oracle Version (npm 11.20.0)
        run: npm install -g npm@11.20.0

      - name: Verify Oracle & Toolchain Versions
        shell: pwsh
        run: |
          node -e 'const [m] = process.versions.node.split(".").map(Number); if (m < 20) { process.exit(1); } console.log("Node compatibility check passed: " + process.version);'
          $npmVer = (npm --version).Trim()
          Write-Host "Verified pinned npm oracle version: $npmVer"
          if ($npmVer -ne "11.20.0") {
            Write-Error "Expected npm 11.20.0, found: $npmVer"
            exit 1
          }
          rustc --version
          cargo --version
          cargo clippy --version

      - name: Cargo Check Workspace
        run: cargo check --workspace --all-targets

      - name: Clippy Gate (Zero Warnings Enforced)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check NPM Test Isolation (Enforced)
        shell: pwsh
        run: ./scripts/check-npm-isolation.ps1

      - name: Workspace Tests Gate (100% Pass Required)
        run: cargo test --workspace

      - name: Build Release Binary
        run: cargo build --release --bin rnpm
