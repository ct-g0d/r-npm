name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify:
    name: Workspace Verification Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pinned Rust Toolchain (1.99.1)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: clippy, rustfmt

      - name: Setup Node.js Oracle (Node 26.13.0)
        uses: actions/setup-node@v4
        with:
          node-version: "26.13.0"

      - name: Pin Explicit npm Oracle Version (npm 11.20.0)
        run: npm install -g npm@11.20.0

      - name: Verify Exact Oracle Versions & Toolchain
        shell: pwsh
        run: |
          $nodeVer = (node --version).Trim()
          Write-Host "Node oracle version: $nodeVer"
          if ($nodeVer -ne "v26.13.0") {
            Write-Error "Expected Node v26.13.0, found: $nodeVer"
            exit 1
          }
          $npmVer = (npm --version).Trim()
          Write-Host "npm oracle version: $npmVer"
          if ($npmVer -ne "11.20.0") {
            Write-Error "Expected npm 11.20.0, found: $npmVer"
            exit 1
          }
          rustc --version
          cargo --version
          cargo clippy --version

      - name: Cargo Check Workspace
        run: cargo check --workspace --all-targets

      - name: Clippy Gate (Zero Warnings Enforced)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Isolation Checker Self-Test
        shell: pwsh
        run: ./scripts/check-npm-isolation.ps1 -SelfTest

      - name: Check NPM Test Isolation (Enforced)
        shell: pwsh
        run: ./scripts/check-npm-isolation.ps1

      - name: Workspace Tests Gate (100% Pass Required)
        run: cargo test --workspace

      - name: Build Release Binary
        run: cargo build --release --bin rnpm

  node24-compat:
    name: Node 24 Compatibility Check (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pinned Rust Toolchain (1.99.1)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"

      - name: Setup Node.js 24 Compatibility
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Pin Explicit npm Oracle Version (npm 11.20.0)
        run: npm install -g npm@11.20.0

      - name: Verify Node 24 and npm Oracle Versions
        shell: pwsh
        run: |
          $nodeVer = (node --version).Trim()
          Write-Host "Node 24 compatibility version: $nodeVer"
          if (-not ($nodeVer -like "v24.*")) {
            Write-Error "Expected Node 24.x, found: $nodeVer"
            exit 1
          }
          node -e 'const [m] = process.versions.node.split(".").map(Number); if (m !== 24) { process.exit(1); }'
          $npmVer = (npm --version).Trim()
          Write-Host "npm oracle version on Node 24: $npmVer"
          if ($npmVer -ne "11.20.0") {
            Write-Error "Expected npm 11.20.0, found: $npmVer"
            exit 1
          }

      - name: Node 24 Compatibility Tests Gate
        run: cargo test --workspace
