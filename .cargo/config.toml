[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:8388608"]

[env]
RUST_MIN_STACK = "8388608"
NPM_CONFIG_CACHE = { value = "target/test-npm/cache", relative = true }
NPM_CONFIG_PREFIX = { value = "target/test-npm/prefix", relative = true }
NPM_CONFIG_USERCONFIG = { value = "target/test-npm/user.npmrc", relative = true }
NPM_CONFIG_GLOBALCONFIG = { value = "target/test-npm/global.npmrc", relative = true }
NPM_CONFIG_LOGS_DIR = { value = "target/test-npm/logs", relative = true }
NPM_CONFIG_AUDIT = "false"
NPM_CONFIG_FUND = "false"
NPM_CONFIG_UPDATE_NOTIFIER = "false"
