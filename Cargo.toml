[workspace]
resolver = "2"
members = [
    "crates/rnpm-core",
    "crates/rnpm-config",
    "crates/rnpm-registry",
    "crates/rnpm-cache",
    "crates/rnpm-lockfile",
    "crates/rnpm-fs",
    "crates/rnpm-install",
    "crates/rnpm-cli",
    "crates/rnpm-shim",
    "crates/rnpm-lifecycle",
    "crates/rnpm-solver",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.99.1"
authors = ["npm-rust contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = { version = "2.12", features = ["serde"] }
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
sha2 = "0.10"
sha1 = "0.10"
data-encoding = "2.6"
flate2 = "1.0"
tar = "0.4"
tempfile = "3.17"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive", "cargo"] }
url = "2.5"
path-clean = "1.0"
fs4 = { version = "0.12", features = ["tokio"] }
memmap2 = "0.9"

# Internal workspace crates
rnpm-core = { path = "crates/rnpm-core" }
rnpm-config = { path = "crates/rnpm-config" }
rnpm-registry = { path = "crates/rnpm-registry" }
rnpm-cache = { path = "crates/rnpm-cache" }
rnpm-lockfile = { path = "crates/rnpm-lockfile" }
rnpm-fs = { path = "crates/rnpm-fs" }
rnpm-install = { path = "crates/rnpm-install" }
rnpm-shim = { path = "crates/rnpm-shim" }
rnpm-lifecycle = { path = "crates/rnpm-lifecycle" }
rnpm-solver = { path = "crates/rnpm-solver" }

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
